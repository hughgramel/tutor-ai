name: InkTutor
options:
  bundleIdPrefix: com.tutorai
  deploymentTarget:
    iOS: "17.0"
targets:
  InkTutor:
    type: application
    platform: iOS
    sources: [InkTutor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutorai.inktutor
        TARGETED_DEVICE_FAMILY: 2   # iPad only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ponytail: signing left blank — set your Team in Xcode > Signing & Capabilities before running on device
        CODE_SIGN_STYLE: Automatic
