name: InkTutor
options:
  bundleIdPrefix: com.tutorai
  deploymentTarget:
    iOS: "17.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3   # exact: TutorWriter reads an internal via Mirror; minor bumps could break it
targets:
  InkTutor:
    type: application
    platform: iOS
    sources: [InkTutor]
    dependencies:
      - package: WebRTC
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutorai.inktutor
        TARGETED_DEVICE_FAMILY: 2   # iPad only
        GENERATE_INFOPLIST_FILE: YES
        # Portrait-first (Hugh, 2026-07-12): paper is portrait, so is the page model
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light   # app is light-mode only (white paper), demo lock
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "InkTutor uses the microphone so you can talk to your tutor."
        # Signing lives HERE, not the Xcode GUI — xcodegen regenerate wipes
        # GUI-set signing (developing-ios-apps skill). Team from
        # `security find-identity` on this Mac.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9GAK47LFPY
  InkTutorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InkTutorTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES   # canvas agent: plain `xcodebuild test` fails at codesign without this
    dependencies:
      - target: InkTutor
schemes:
  InkTutor:
    build:
      targets: {InkTutor: all}
    test:
      targets: [InkTutorTests]
